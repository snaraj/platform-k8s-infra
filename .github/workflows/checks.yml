name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  composition-and-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified tools
        run: bash scripts/ci/install-tools.sh scan
      - name: Validate composition and security tests
        run: make check
      - name: Scan the complete outgoing history and current files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: python3 -I -B scripts/publication.py --ci --secrets

  acquired-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified tools
        run: bash scripts/ci/install-tools.sh verify
      - name: Reproduce both complete acquisition receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: make verify
