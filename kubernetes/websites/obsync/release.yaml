apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsync
  namespace: obsidian
  labels:
    app.kubernetes.io/managed-by: fluxcd
  annotations:
    platform.snaraj.dev/readiness: active-via-signature-verified-chart
spec:
  # Unsuspended by the promotion that replaced the sentinel with the acquired
  # digest. The two are one change on purpose: `scripts/validate.py` refuses an
  # unsuspended pending release and refuses a sentinel selection for an active
  # application, so neither half can land without the other.
  suspend: false
  # The same one-minute ceiling the two active applications carry: a poll of
  # already-verified state, no webhook receiver, no inbound path, no new object.
  interval: 1m0s
  # helm-controller retains five release revisions as namespace Secrets when
  # this field is unset, and `storage.Create` prunes to maxHistory-1 BEFORE
  # writing the new revision, so any retention at or above the namespace Secret
  # budget wedges the release permanently. Two keeps steady-state history
  # inside the budget while preserving one rollback target for the
  # `strategy: rollback` remediation below.
  maxHistory: 2
  releaseName: obsync
  # Application-specific, not the generic `helm-reconciler` the two sites use.
  #
  # DEPENDS ON A COMPANION PLATFORM CHANGE. This account is created by
  # `snaraj/platform`, which owns namespaces, RBAC and reconciliation
  # definitions; the change that adds its ServiceAccount, Role and RoleBinding —
  # creation unnamed, every follow-up mutation pinned by `resourceNames` to the
  # chart's rendered names, and no namespace-wide claim rule — has merged there.
  # A merge in that repository is not proof the cluster holds the object, and
  # this repository cannot check: until the account exists in `obsidian` this
  # name resolves to nothing and helm-controller cannot act.
  serviceAccountName: obsync-helm-reconciler
  driftDetection:
    mode: enabled
  # The chart artifact comes from the signature-verified OCIRepository beside
  # this file, which now names a real digest — so source-controller produces an
  # artifact only if cosign verifies it against the publisher identity that
  # object anchors, and a chart the signature does not cover reaches nothing.
  # chartRef carries no namespace, so helm-controller (started with
  # --no-cross-namespace-refs=true) can only resolve it inside this
  # application's own namespace.
  chartRef:
    kind: OCIRepository
    name: obsync-chart
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  # Unlike the two site charts, the obsync chart is a deployment-provider
  # BINDING POINT: it ships no hostname, no edge posture, no storage class and
  # no Secret name of its own, and its values schema is closed
  # (`additionalProperties: false`) and refuses a half-specified deployment.
  # Everything below is therefore a value the platform must state, and the set
  # is exact — the manifest-shape policy pins these bytes. What is NOT here is
  # what matters: no image repository, tag or digest. The signed chart remains
  # the sole workload image-identity carrier.
  values:
    # The reviewed activation gate, and the one value here that describes the
    # CLUSTER rather than this repository — which is why selecting a verified
    # chart never moves it, in either direction. It is `true` because the
    # operator proved the prerequisites it names, in the reviewed order and
    # each under its own authorization: the `obsidian` namespace with both
    # reconciler authority layers; the ADR 0012 physical-profile host
    # preparation of `snaraj/platform`'s application-sync runbook section 3b —
    # `/mnt/local-pie-ssd/obsidian/obsync-blobs` and `…/obsync-journal` owned
    # `65532:65532`, mode `0700`, root-owned non-group-writable parents, no
    # symlink on either path; the two operator-owned PersistentVolumes
    # `obsync-blobs` and `obsync-journal` on the existing `local-pie-ssd`
    # class; and the `obsync-server-key` Secret from the owner ceremony. That
    # evidence is referenced sanitized from the promotion review, never carried
    # here.
    #
    # What this value DOES in the selected chart, stated exactly. It gates the
    # rendered Deployment's `spec.replicas` — 0 when false, 1 when true — and
    # gates nothing else: the SAME six objects render at either value
    # (ServiceAccount, Service, NetworkPolicy, both PersistentVolumeClaims and
    # the Deployment), and the `platform.snaraj.dev/deployment-ready`
    # annotation is carried at both. Nothing was omitted at `false`; a
    # non-boolean value is refused by the chart's closed schema, and the
    # chart's own render pins (`scripts/ci/chart_pins.py readiness`) hold both
    # shapes. The claims already rendered at `false` so they could bind their
    # pre-provisioned volumes, and the Service already rendered so the TLS
    # proxy could resolve it; with WaitForFirstConsumer the binding only
    # completes once this value schedules a Pod.
    #
    # Two consequences. Reconciling this starts ONE application replica, so the
    # operator's suspended reconciler is unsuspended by the platform runbook's
    # own step and not by this file. And the reverse is equally a reviewed
    # composition change: a readiness rollback is never a claim deletion, a
    # data deletion or an artifact change.
    deploymentReady: true
    # `none`, NOT `cloudflare`, and the wrong value here fails closed but
    # totally. `cloudflare` makes the server REQUIRE the edge's
    # connecting-address and request-id headers on every request and refuse
    # requests that lack them. Those are set by Cloudflare's HTTP edge on a
    # PUBLIC hostname path. This workload is reached over a PRIVATE WARP route
    # that never traverses that edge, so they are never set and `cloudflare`
    # would refuse every request from the owner's own device.
    edge:
      mode: none
    # The in-cluster TLS proxy, NEVER the Tunnel connector. The obsync server
    # speaks plain HTTP; binding this peer to the connector would admit the
    # connector straight to that cleartext listener. The reviewed design admits
    # only connector -> proxy (TLS) and proxy -> application (HTTP).
    #
    # REAL IDENTITY, replacing the `-pending` placeholder this composition was
    # onboarded with. The proxy is a separate platform workload — not a sidecar
    # — and `snaraj/platform` has now reviewed and merged its Deployment, whose
    # Pod template carries `app.kubernetes.io/name: obsync-tls-proxy` and
    # `app.kubernetes.io/instance: obsync-tls-proxy` in this namespace. These
    # two values are that pair, so the rendered ingress policy admits exactly
    # those Pods and nothing else. The placeholder was correct while no such
    # Pod could exist and is retired here rather than carried into activation:
    # a name no Pod will ever carry stops being a fail-closed statement once
    # the real one is reviewed and knowable.
    ingress:
      peerAppName: obsync-tls-proxy
      peerInstance: obsync-tls-proxy
      peerNamespace: obsidian
    # Empty, not a sentinel hostname. The chart's closed schema admits the
    # empty string and the application treats an unset public URL as unset —
    # the pairing page shows none and a device is given the address by the
    # person setting it up. The owner's private name and the private route's
    # address live only in operator inputs and never enter this repository; a
    # placeholder hostname is a habit of carrying the real one later.
    publicUrl: ""
    # The envelope the platform's namespace ResourceQuota is derived from.
    # `2000m` rather than `2`: identical to Kubernetes, and it keeps this
    # manifest inside an unquoted-scalar grammar.
    resources:
      limits:
        cpu: 2000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
    # A Secret reference, never a literal: this repository carries no secrets
    # and this one is created by an owner ceremony on the cluster.
    serverKeySecret:
      key: OBSYNC_SERVER_KEY
      name: obsync-server-key
    # `size` is what the claim requests AND what the server is told through
    # OBSYNC_*_CAPACITY — the claim guarantee is the only number that cannot
    # overstate what the pod may write. `capacity` records what the operator
    # provisioned on the volume the claim binds to, so the two are equal here.
    #
    # THE PHYSICAL PROFILE, not the reserved-file one. `local-pie-ssd` is the
    # existing ADR 0012 class the two sites already use: a static
    # no-provisioner class over directories on the node's local SSD, with the
    # volumes created by the operator and pre-bound to these exact claims. The
    # `local-pie-ssd-reserved` profile of ADR 0017 was selected first and is NOT
    # deliverable: its qualification requires a FIEMAP collector and an
    # installed-kernel discard-prevention mechanism that `snaraj/platform` does
    # not ship, and the SSD has less free space than a fully allocated 250 GiB
    # backing file needs. That profile's source remains admitted in the
    # platform's policy and can be selected later by its own reviewed change.
    #
    # WHAT 100Gi MEANS HERE, said plainly because the class does not enforce
    # it. A local PersistentVolume ADVERTISES capacity; it reserves nothing on
    # a filesystem shared with the media library. This number is the
    # application's own budget — the claim guarantee plus OBSYNC_BLOBS_CAPACITY
    # — chosen to sit inside the measured headroom, not a physical reservation.
    # Buying a reservation was exactly what the reserved-file profile was for.
    # Changing either number is a reviewed composition change; neither class
    # expands or migrates an already-bound claim through a values edit.
    storage:
      blobs:
        capacity: 100Gi
        className: local-pie-ssd
        size: 100Gi
      journal:
        capacity: 4Gi
        className: local-pie-ssd
        size: 4Gi
    # Empty is the STRICT setting, not the lazy one: in `none` edge mode the
    # server believes a forwarded address only from a listed range, so an empty
    # list means it believes only the peer address — the TLS proxy above, the
    # sole ingress path the default-deny policy admits. A CIDR here would make
    # an `X-Forwarded-For` header believable from anything in that range.
    trustedProxyCidrs: []
