# obsync's Helm chart is published as a signed OCI artifact by the snaraj/obsync
# release publisher. The application is `obsync` all the way down — chart,
# image, source repository, Flux release, connector, both Secrets, both volumes
# — while the NAMESPACE is `obsidian`, the owner's, which may later hold other
# Obsidian-related workloads. Nothing here is derived from the namespace name.
#
# FILLED — `ref.digest` below is the acquired chart, not the sentinel.
# This slug is in APPLICATIONS, and `scripts/validate.py` refuses the all-zero
# sentinel for an active application exactly as it refused a real digest while
# the slug was pending. The two rules are opposites, so the promotion could not
# half-land: the digest and the map entry had to arrive together.
#
# The digest was resolved from `ghcr.io/snaraj/charts/obsync:0.1.4` only AFTER
# cosign verified that artifact against the publisher identity the `verify`
# block at the foot of this file names, and the tag was then re-verified in
# digest form so the signature and this selection bind the same bytes.
#
# Why 0.1.4 and not an older tag. `v0.1.4` is the release in which
# `deploymentReady` GATES the rendered Deployment's `spec.replicas` — 0 when
# false, 1 when true — instead of only reaching an annotation. `v0.1.3` is a
# complete Release and verifies, but its value was annotation-only and its
# render carried a one-replica Deployment either way, which is a claim rather
# than a gate; a reviewer found that and the chart was fixed rather than the
# claim reworded. `v0.1.2` exists as a Git tag with an attested image, but the
# publisher pushed no chart for it and cut no Release, so there is nothing at
# `charts/obsync:0.1.2` to select at all.
#
# Every fail-closed property the two active sources carry is already true here
# and none may be relaxed without a reviewed decision:
#
#   * spec.verify is MANDATORY, anchored end to end on the obsync publisher
#     running on protected `main`. The two site publishers, another workflow in
#     the same repository, a run at any other ref — a tag ref included — and
#     any look-alike host are all rejected. The branch ref is the stronger
#     anchor: a run at a ref executes the workflow definition AT that ref, and
#     `refs/heads/main` is the only ref in that repository whose creation and
#     update are gated by a ruleset with no bypass actors.
#   * spec.ref contains exactly one sha256 digest and no tag or semver range,
#     so moving, deleting or replacing a registry tag cannot change the bytes
#     Flux selects.
#   * No secretRef, serviceAccountName, certSecretRef or proxySecretRef: the
#     registry is read anonymously and the cluster holds no registry
#     credential, exactly as it holds no Git credential.
#   * The layer selector pins the Helm chart media type, so a non-chart layer
#     smuggled into the artifact is not what gets reconciled.
#   * spec.interval is one minute, the same poll of already-verified state the
#     two active applications use. It adds no credential, no inbound path and
#     no object.
#
# The chart is also the sole workload image-identity carrier; the HelmRelease
# beside this file contains no repository, tag or digest override.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  annotations:
    platform.snaraj.dev/chart-release: "0.1.10"
  name: obsync-chart
  namespace: obsidian
spec:
  interval: 1m0s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:e5a81beff25a4745ad78b1f35c7f599a530b9181034fd2cbeef830915af24e64
  timeout: 60s
  url: oci://ghcr.io/snaraj/charts/obsync
  verify:
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/snaraj/obsync/\.github/workflows/release-publisher\.yml@refs/heads/main$
    provider: cosign
